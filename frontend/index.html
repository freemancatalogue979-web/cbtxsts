<!doctype html>
<!-- Daylight is the default skin; the pre-paint script restores saved choices before the first frame. -->
<html lang="en" data-skin="day">
  <head>
    <meta charset="UTF-8" />
    <!-- One fixed scale: the arena is drawn for the viewport it lands on. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#eaf4ff" />
    <link rel="icon" type="image/svg+xml" href="/brand/ag-sigil.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/brand/ag-logo-96.png" />
    <link rel="preload" as="image" href="/brand/absolute-genesis-crown-emblem.png" type="image/png" fetchpriority="high" />
    <link rel="apple-touch-icon" href="/brand/ag-apple-touch-180.png" />
    <!-- Installable app: manifest + standalone look on iPhone/Android. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Genesis" />
    <title>Absolute Genesis — A completely new beginning.</title>
    <meta
      name="description"
      content="Absolute Genesis — a completely new beginning. Real-time computer-based testing and exam practice: timed CBT exams, study materials, an AI tutor, live 1v1 duels, XP, streaks, leaderboards and prizes."
    />
    <meta property="og:title" content="Absolute Genesis — A completely new beginning." />
    <meta property="og:image" content="/brand/ag-logo-256.png" />
    <meta property="og:description" content="Timed CBT exams, live duels with friends, XP, streaks, leaderboards and real prizes." />
    <meta property="og:type" content="website" />
    <script>
      // Apply saved theme, mode, skin and font before first paint — no flash of defaults.
      try {
        var theme = localStorage.getItem('arena.theme');
        if (theme) document.documentElement.dataset.theme = theme;
        var mode = localStorage.getItem('arena.mode');
        if (mode) document.documentElement.dataset.mode = mode;
        var skin = localStorage.getItem('arena.skin');
        if (skin !== 'day' && skin !== 'night') skin = 'day';
        document.documentElement.dataset.skin = skin;
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', skin === 'night' ? '#07030f' : '#eaf4ff');
        var FONTS = {
          courier: ["Courier, 'Courier New', monospace", "Courier, 'Courier New', monospace"],
          'dm-sans': ["'DM Sans Variable', 'Space Grotesk Variable', ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif", "'DM Sans Variable', 'Space Grotesk Variable', ui-sans-serif, sans-serif"],
          montserrat: ["'Montserrat Variable', ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif", "'Audiowide', 'Montserrat Variable', sans-serif"],
          'helvetica-oblique': ["'AG Helvetica Oblique', 'Helvetica Neue', Helvetica, Arial, sans-serif", "'AG Helvetica Oblique', 'Helvetica Neue', Helvetica, Arial, sans-serif"],
          arena: ["'Exo 2', ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif", "'Audiowide', 'Orbitron', 'Exo 2', sans-serif"],
          grotesk: ["'Space Grotesk Variable', ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif", "'Space Grotesk Variable', 'Audiowide', sans-serif"],
          orbit: ["'Montserrat Variable', ui-sans-serif, sans-serif", "'Orbitron', 'Audiowide', sans-serif"]
        };
        // Match prefs.ts: Courier desktop, Space Grotesk mobile; no old DM Sans default.
        var savedFont = localStorage.getItem('arena.font.v8') || localStorage.getItem('arena.font.v7') || localStorage.getItem('arena.font.v6') || localStorage.getItem('arena.font.v5') || localStorage.getItem('arena.font.v4');
        if (!localStorage.getItem('arena.font.v8') && savedFont === 'dm-sans') savedFont = '';
        var mobile = window.matchMedia && window.matchMedia('(max-width: 1023px)').matches;
        var font = savedFont && FONTS[savedFont] ? savedFont : (mobile ? 'grotesk' : 'courier');
        document.documentElement.dataset.font = font;
        if (FONTS[font]) {
          document.documentElement.style.setProperty('--font-sans', FONTS[font][0]);
          document.documentElement.style.setProperty('--font-display', FONTS[font][1]);
        }
      } catch (error) {}
    </script>
    <!-- Launch screen. Styled inline so it paints on the very first frame —
         before the app bundle (and its CSS, in dev) has loaded. React's own
         <Splash /> reuses these classes, so the hand-over is seamless. -->
    <style>
      @font-face {
        font-family: 'DM Sans Variable'; font-style: normal; font-weight: 100 900; font-display: swap;
        src: url('/fonts/dm-sans-latin-variable.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Space Grotesk Variable'; font-style: normal; font-weight: 300 700; font-display: swap;
        src: url('/fonts/space-grotesk-latin-variable.woff2') format('woff2');
      }
      html, body { background: #07030f; }
      html[data-skin='day'], html[data-skin='day'] body { background-color: #eaf4ff; }
      /* The splash is the brand's first breath, so it is the brand's own dark
         stage in both skins — a deep violet field with a gold dawn behind the
         sigil. The chosen skin takes over the moment React paints. */
      .ag-splash {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden;
        color: #fff; -webkit-tap-highlight-color: transparent; user-select: none;
        /* True black matches the raw PNG's own background edge to edge. */
        background: #000;
      }
      /* the starfield */
      .ag-splash::before {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background:
          radial-gradient(1.3px 1.3px at 18% 24%, rgba(255, 255, 255, 0.75), transparent),
          radial-gradient(1px 1px at 62% 14%, rgba(255, 255, 255, 0.5), transparent),
          radial-gradient(1.5px 1.5px at 82% 32%, rgba(250, 204, 21, 0.6), transparent),
          radial-gradient(1px 1px at 34% 68%, rgba(255, 255, 255, 0.4), transparent),
          radial-gradient(1.4px 1.4px at 74% 74%, rgba(196, 181, 253, 0.6), transparent),
          radial-gradient(1px 1px at 8% 52%, rgba(255, 255, 255, 0.35), transparent);
      }
      .ag-splash__stack { position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 1.5rem; }
      .ag-splash__logo {
        display: block; width: min(92vw, 32rem); height: auto; max-height: 52dvh; object-fit: contain; margin-bottom: 1.6rem;
        /* Exact uploaded PNG: no filter, crop, transparency edit or derived artwork. */
        animation: ag-rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .ag-splash__tag {
        margin: 0; padding-left: 0.34em; text-align: center; text-transform: uppercase; letter-spacing: 0.34em;
        font: italic 700 0.72rem/1.4 Courier, 'Courier New', monospace;
        background: linear-gradient(90deg, #c4b5fd 0%, #fde68a 35%, #fff7d6 50%, #fde68a 65%, #c4b5fd 100%);
        background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: ag-fade 0.8s ease 0.35s both, ag-sheen 5s linear 1.2s infinite;
      }
      .ag-splash__bar {
        width: 8.5rem; height: 3px; margin-top: 1.4rem; border-radius: 99px; overflow: hidden;
        background: rgba(255, 255, 255, 0.08); animation: ag-fade 0.6s ease 0.6s both;
      }
      .ag-splash__bar > span {
        display: block; width: 42%; height: 100%; border-radius: inherit;
        background: linear-gradient(90deg, transparent, #a78bfa, #fcd34d, transparent);
        animation: ag-load 1.35s ease-in-out infinite;
      }
      .ag-splash__foot {
        position: absolute; left: 0; right: 0; bottom: max(1.6rem, env(safe-area-inset-bottom)); margin: 0; text-align: center;
        font: italic 700 0.6rem/1 Courier, 'Courier New', monospace; letter-spacing: 0.22em;
        text-transform: uppercase; color: rgba(226, 232, 240, 0.32); animation: ag-fade 0.8s ease 0.8s both;
      }
      @media (max-width: 1023px) {
        .ag-splash__tag, .ag-splash__foot { font-family: 'Space Grotesk Variable', ui-sans-serif, sans-serif; font-style: normal; font-weight: 400; }
      }
      /* React's copy takes over mid-animation: no second entrance. */
      .ag-splash--live .ag-splash__logo { animation: none; }
      .ag-splash--live .ag-splash__tag { animation: ag-sheen 5s linear infinite; }
      .ag-splash--live .ag-splash__bar, .ag-splash--live .ag-splash__foot { animation: none; }
      @keyframes ag-rise { from { opacity: 0; transform: translateY(18px) scale(0.92); } to { opacity: 1; transform: none; } }
      @keyframes ag-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes ag-sheen { from { background-position: 0% 0; } to { background-position: 220% 0; } }
      @keyframes ag-load { from { transform: translateX(-110%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        .ag-splash * { animation: none !important; }
        .ag-splash__bar > span { width: 100%; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ag-splash" role="status" aria-label="Loading Absolute Genesis">
        <div class="ag-splash__stack">
          <img class="ag-splash__logo" src="/brand/absolute-genesis-crown-emblem.png" alt="Absolute Genesis" width="1536" height="1024" fetchpriority="high" draggable="false" />
          <p class="ag-splash__tag">A completely new beginning</p>
          <div class="ag-splash__bar"><span></span></div>
        </div>
        <p class="ag-splash__foot">CBT exams · Study · Compete</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
