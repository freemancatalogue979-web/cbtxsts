<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070a12" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="9 Clover — private competitive training, analysis and strategy hub. Play. Review. Adapt. Dominate." />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <!-- Installable app: manifest + iOS home-screen behaviour (full screen, dark status bar). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="9 Clover" />
    <meta name="apple-mobile-web-app-title" content="9 Clover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>9 Clover — The Hub</title>
    <script>
      // Apply the saved appearance before the first paint so there is no flash
      // of the wrong colour: accent, backdrop and motion.
      (function () {
        var root = document.documentElement;
        // Default accent per area; kept in sync with SECTION_THEMES in
        // src/lib/theme.ts by tests/theme.test.mjs.
        var ACCENTS = {
          dashboard: "crimson", ai: "emerald", utility: "cyan", training: "cyan", scrims: "violet",
          tournaments: "amber", esports: "azure", mlbb: "azure", reviews: "violet",
          heroes: "fuchsia", intel: "emerald", players: "cyan", bans: "crimson",
          drafts: "lime", maps: "emerald", strategy: "amber", archive: "fuchsia",
          events: "amber", notifications: "crimson", trash: "violet", admin: "azure", login: "crimson"
        };
        var section = (location.hash.replace(/^#\/?/, "").split("/")[0] || "dashboard").toLowerCase();
        if (!ACCENTS[section]) section = "dashboard";
        var stored = null;
        try {
          // The font menu is gone (one bundled typeface only); drop any old choice.
          window.localStorage.removeItem("clover_font_choice");
          stored = window.localStorage.getItem("clover_theme_accent");
          root.dataset.backdrop = window.localStorage.getItem("clover_theme_backdrop") === "off" ? "plain" : "hero";
          root.dataset.effects = window.localStorage.getItem("clover_theme_motion") === "calm" ? "calm" : "full";
        } catch (error) {
          root.dataset.backdrop = "hero";
          root.dataset.effects = "full";
        }
        var pinned = false;
        for (var id in ACCENTS) if (ACCENTS[id] === stored) pinned = true;
        root.dataset.section = section;
        root.dataset.accent = pinned ? stored : ACCENTS[section];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
