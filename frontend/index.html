<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0d" />
    <meta name="description" content="9 CLOVER — private competitive training, analysis and strategy hub. PLAY. REVIEW. ADAPT. DOMINATE." />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0a0d" />
    <title>9 CLOVER — The Hub</title>
    <script>
      // Apply the saved appearance before the first paint so there is no flash
      // of the wrong font or colour: text style, accent, backdrop and motion.
      (function () {
        var root = document.documentElement;
        // Default accent per area; kept in sync with SECTION_THEMES in
        // src/lib/theme.ts by tests/theme.test.mjs.
        var ACCENTS = {
          dashboard: "crimson", ai: "emerald", training: "cyan", scrims: "violet",
          tournaments: "amber", esports: "azure", mlbb: "azure", reviews: "violet",
          heroes: "fuchsia", intel: "emerald", players: "cyan", bans: "crimson",
          drafts: "lime", maps: "emerald", strategy: "amber", archive: "fuchsia",
          events: "amber", notifications: "crimson", admin: "azure", login: "crimson"
        };
        var section = (location.hash.replace(/^#\/?/, "").split("/")[0] || "dashboard").toLowerCase();
        if (!ACCENTS[section]) section = "dashboard";
        var stored = null;
        try {
          var font = window.localStorage.getItem("clover_font_choice");
          root.dataset.font = font === "montserrat" || font === "corptic" ? font : "dmmono";
          stored = window.localStorage.getItem("clover_theme_accent");
          root.dataset.backdrop = window.localStorage.getItem("clover_theme_backdrop") === "off" ? "plain" : "hero";
          root.dataset.effects = window.localStorage.getItem("clover_theme_motion") === "calm" ? "calm" : "full";
        } catch (error) {
          root.dataset.font = "dmmono";
          root.dataset.backdrop = "hero";
          root.dataset.effects = "full";
        }
        var pinned = false;
        for (var id in ACCENTS) if (ACCENTS[id] === stored) pinned = true;
        root.dataset.section = section;
        root.dataset.accent = pinned ? stored : ACCENTS[section];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
